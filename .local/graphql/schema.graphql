    input: AddProjectStageToProjectInput!
  ): ProjectStageAdded!
  applyRequisitionToProject(
    input: ApplyRequisitionToProjectInput!
  ): ApplyRequisitionPayload!
  createCustomer(input: CreateCustomerInput!): CustomerCreated!
}

