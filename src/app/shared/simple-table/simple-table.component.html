<div>
  <p-table [value]="data()"
           [(selection)]="selectedItems"
           selectionMode="multiple">
    <ng-template #header>
      <tr>
        <th style="width: 3rem;">
          <p-tableHeaderCheckbox />
        </th>
        @for (col of columns(); track col.key) {
          <th>{{ col.name }}</th>
        }
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td>
          <p-tableCheckbox [value]="row" />
        </td>
        @for (col of columns(); track col.key) {
          <td>{{ columnValue(col, row[col.key]) }}</td>
        }
      </tr>
    </ng-template>
  </p-table>
</div>
