<div>
  <p-table [value]="data()">
    <ng-template #header>
      <tr>
        @for (col of columns(); track col.key) {
          <th>{{ col.name }}</th>
        }
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        @for (col of columns(); track col.key) {
          <td>{{ row[col.key] }}</td>
        }
      </tr>
    </ng-template>
  </p-table>
</div>
