<div class="container">
  <p-toolbar class="header" [style]="{ 'border-radius': '0' }">
    <ng-template #start>
      <span>{{ title }}</span>
    </ng-template>
    <ng-template #end>
      @if (expandable === true) {
        <p-button (click)="toggleExpansion()" size="small" text>
          @if (expanded) {
            <i class="pi pi-angle-down"></i>
          } @else {
            <i class="pi pi-angle-right"></i>
          }
        </p-button>
      }
    </ng-template>
  </p-toolbar>

  @if (expanded) {
    <div class="content-container">
      <div class="content">
        <ng-content></ng-content>
      </div>
    </div>
  }
</div>
