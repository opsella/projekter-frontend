<div>
  <cdk-table
    [dataSource]="dataSource"
    multiTemplateDataRows
    class="table"
    #table
    style="display: flex; flex-flow: column; width: 98%; border: solid 1px red"
  >
    <ng-container
      *ngFor="let propertyName of columnHeaders"
      cdkColumnDef="{{ propertyName }}"
    >
      <cdk-header-cell *cdkHeaderCellDef></cdk-header-cell>
      <cdk-cell *cdkCellDef="let row" class="column">
        {{ row.data[propertyName] }}
      </cdk-cell>
    </ng-container>

    <ng-container cdkColumnDef="actions">
      <cdk-header-cell *cdkHeaderCellDef></cdk-header-cell>
      <cdk-cell *cdkCellDef="let row" class="column">
        This should be there
      </cdk-cell>
    </ng-container>

    <ng-container cdkColumnDef="expand">
      <cdk-header-cell *cdkHeaderCellDef></cdk-header-cell>
      <cdk-cell *cdkCellDef="let element">
        <button
          mat-icon-button
          aria-label="expand row"
          (click)="
            expandedElement = expandedElement === element ? null : element;
            $event.stopPropagation()
          "
        >
          <mat-icon *ngIf="expandedElement !== element"
            >keyboard_arrow_down</mat-icon
          >
          <mat-icon *ngIf="expandedElement === element"
            >keyboard_arrow_up</mat-icon
          >
        </button>
      </cdk-cell>
    </ng-container>

    <ng-container cdkColumnDef="expandedDetail">
      <cdk-cell
        *cdkCellDef="let element"
        [attr.colspan]="columnHeadersWithActions"
      >
        <div
          class="example-element-detail"
          [@detailExpand]="
            element === expandedElement ? 'expanded' : 'collapsed'
          "
        >
          <app-expansion-table-content
            [data]="element"
          ></app-expansion-table-content>
          <button (click)="viewItem(element.data)">Details</button>
        </div>
      </cdk-cell>
    </ng-container>

    <cdk-header-row
      *cdkHeaderRowDef="columnHeadersWithActions"
      class="mf-header"
    ></cdk-header-row>
    <cdk-row
      *cdkRowDef="let element; columns: columnHeadersWithActions"
      class="example-element-row"
      [class.example-expanded-row]="expandedElement === element"
      (click)="expandedElement = expandedElement === element ? null : element"
    ></cdk-row>
    <cdk-row *cdkRowDef="let row; columns: ['expandedDetail']"></cdk-row>
  </cdk-table>
</div>
