<section *ngIf="!flow">
  <h1>{{ title }}</h1>

  <button mat-button (click)="startFlow('flow1')">{{ flow1ButtonText }}</button>
  <button mat-button (click)="startFlow('flow2')">{{ flow2ButtonText }}</button>
</section>

<section *ngIf="flow === 'flow1'">
  <ng-content select="[flow1]"></ng-content>
</section>

<section *ngIf="flow === 'flow2'">
  <ng-content select="[flow2]"></ng-content>
</section>

<section *ngIf="flow">
  <button mat-button (click)="flow = null">BACK</button>
  <ng-content select="[action]"></ng-content>
</section>
