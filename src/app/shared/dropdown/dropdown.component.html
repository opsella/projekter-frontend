<div>
  <ng-content></ng-content>

  <div class="dropdown-container"
       [style.left]="cornerPosition">
    <div class="dropdown-content">
      @for (option of options; track option.id) {
        <ng-container>
          @if (option.isVisible()) {
            <a (click)="handleClicked(option.id)">
              {{ option.name }}
            </a>
          }
        </ng-container>
      }
    </div>
  </div>
</div>
