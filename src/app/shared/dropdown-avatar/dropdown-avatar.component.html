<div class="avatar-container">
  <button class="avatar-button" (click)="select.open()">
    <img [src]="avatarUrl" alt="User avatar and additional options" class="avatar" />
  </button>

  <mat-select #select id="avatar-select" (selectionChange)="selectionChangedHandler($event)">
    <ng-container *ngFor="let option of options">
      <mat-option *ngIf="option.isVisible()" [value]="option.id">
        {{ option.name }}
      </mat-option>
    </ng-container>
  </mat-select>
</div>
