<div class="avatar-container">
  <div class="dropdown">
    <div class="dropdown-content" [class.dropdown-content-open]="openDropdown()">
      @for (option of options; track option.id) {
        <ng-container>
          @if (option.isVisible()) {
            <a (click)="dropdownClicked(option.id)">
              {{ option.name }}
            </a>
          }
        </ng-container>
      }
    </div>
  </div>
</div>
