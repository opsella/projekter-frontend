<ng-container>
  <app-table-filters [filters]="tableFilters$ | async"></app-table-filters>

  <cdk-table
    [dataSource]="tableDataSource"
    class="expansion-table"
    #table
  >
    @for (propertyName of columnHeaders; track propertyName) {
      <ng-container [cdkColumnDef]="propertyName">
        <cdk-header-cell *cdkHeaderCellDef></cdk-header-cell>
        <cdk-cell *cdkCellDef="let row" class="cell">
          {{ row.data[propertyName] }}
        </cdk-cell>
      </ng-container>
    }

    <ng-container cdkColumnDef="actions">
      <cdk-header-cell *cdkHeaderCellDef></cdk-header-cell>
      <cdk-cell *cdkCellDef="let row" class="cell">
        @for (action of row.actions; track action.id) {
          <button
            (click)="action.action(row); $event.stopPropagation()"
            [disabled]="!action.enabled"
          >
            {{ action.title }}
          </button>
        }
      </cdk-cell>
    </ng-container>

    <ng-container cdkColumnDef="expand">
      <cdk-header-cell *cdkHeaderCellDef></cdk-header-cell>
      <cdk-cell *cdkCellDef="let element" class="cell cell-expand">
        <button
          mat-icon-button
          aria-label="expand row"
          (click)="updateExpandedElements(element)"
        >
          @if (elementIsExpanded(element)) {
            <i class="pi pi-angle-down"></i>
          } @else {
            <i class="pi pi-angle-up"></i>
          }
        </button>
      </cdk-cell>
    </ng-container>

    <ng-container cdkColumnDef="expandedDetail" class="test">
      <cdk-cell
        *cdkCellDef="let element"
        [attr.colspan]="columnHeadersWithActions"
      >
        <div
          class="expansion-content"
          [@detailExpand]="elementTransitionStage(element)"
        >
          <app-expansion-table-content
            [data]="element"
          ></app-expansion-table-content>
        </div>
      </cdk-cell>
    </ng-container>

    <cdk-header-row
      *cdkHeaderRowDef="columnHeadersWithActions"
      class="mf-header"
    ></cdk-header-row>
    <cdk-row
      *cdkRowDef="let element; columns: columnHeadersWithActions"
      class="row"
      [class.example-expanded-row]="elementIsExpanded(element)"
    ></cdk-row>

    <cdk-row *cdkRowDef="let row; columns: ['expandedDetail']"></cdk-row>
  </cdk-table>
</ng-container>
