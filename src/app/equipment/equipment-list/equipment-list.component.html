<app-page-wrapper title="Equipment">
  <button (click)="createEquipment()">Create</button>

  <mat-table [dataSource]="(equipmentDataSource$ | async) ?? []">
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef> Name </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.name }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="code">
      <mat-header-cell *matHeaderCellDef> Code </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.code }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.description }} </mat-cell>
    </ng-container>

    <mat-header-row
      *matHeaderRowDef="['name', 'code', 'description']"
    ></mat-header-row>
    <mat-row
      (click)="viewEquipment(row)"
      *matRowDef="let row; columns: ['name', 'code', 'description']"
    ></mat-row>
  </mat-table>
</app-page-wrapper>

<!--this button will eventually be an "action" in the table row-->
<button (click)="editEquipment()">Edit</button>
