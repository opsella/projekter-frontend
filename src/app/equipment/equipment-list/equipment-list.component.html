<app-page-wrapper title="Equipment">
  <mat-table [dataSource]="(equipmentDataSource$ | async) ?? []">
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef> Name </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.name }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="code">
      <mat-header-cell *matHeaderCellDef> Code </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.code }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.description }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
      <mat-cell *matCellDef="let row">
        <button (click)="editEquipment(row)">Edit</button>
        <button (click)="viewEquipment(row)">Details</button>
      </mat-cell>
    </ng-container>

    <mat-header-row
      *matHeaderRowDef="['name', 'code', 'description', 'actions']"
    ></mat-header-row>
    <mat-row
      *matRowDef="let row; columns: ['name', 'code', 'description', 'actions']"
    ></mat-row>
  </mat-table>

  <app-action-footer
    [actions]="actions"
    (actionEvent)="$event.action?.()"
  ></app-action-footer>
</app-page-wrapper>
