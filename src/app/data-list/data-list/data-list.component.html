<div>
  @for (item of data.connect(collectionViewer) | async; track item) {
    <div>
      <ng-container
        *ngTemplateOutlet="ContentHeader; context: { $implicit: item }"
      ></ng-container>
      <ng-container
        *ngTemplateOutlet="ContentBody; context: { $implicit: item }"
      ></ng-container>
      <ng-container
        *ngTemplateOutlet="ContentFooter; context: { $implicit: item }"
      >
      </ng-container>
    </div>
  }
</div>
