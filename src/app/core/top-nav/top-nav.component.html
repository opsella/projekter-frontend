<nav>
  <section class="company-logo-container">
    <div class="logo">
      <a routerLink="/">
        <img class="company-logo" src="assets/images/logo-5.svg" alt="home" />
      </a>
    </div>

    <button class="nav-expand-button">
      <i class="fa-sharp fa-solid fa-angles-right"></i>
    </button>
  </section>

  <section class="main-routes">
    <ul>
      <li *ngFor="let route of mainRoutes">
        <app-navigation-route-element
          [routeName]="route.name"
          [routeUrl]="route.path"
        >
          <i [class]="route.icon" class="icon"></i>
        </app-navigation-route-element>
      </li>
    </ul>
  </section>

  <section class="secondary-routes">
    <app-navigation-route-element
      [routeName]="settingsRoute.name"
      [routeUrl]="settingsRoute.path"
    >
      <i [class]="settingsRoute.icon" class="settings-icon"></i>
    </app-navigation-route-element>

    <div class="extras">
      <ul>
        <li *ngFor="let route of secondaryRoutes">
          <app-navigation-route-element
            [routeName]="route.name"
            [routeUrl]="route.path"
          >
            <i [class]="route.icon" class="icon-secondary"></i>
          </app-navigation-route-element>
        </li>
      </ul>
    </div>
  </section>
</nav>
