<aside>
  <div class="maybe-something-useful"></div>
  <!--  <select class="maybe-something-useful">-->
  <!--    <option>Something Important</option>-->
  <!--  </select>-->

  <div class="active-user-container">
    <div class="notification-icon">
      <a
        routerLink="/notifications"
        routerLinkActive="active"
        aria-label="Notifications"
      >
        <i class="fa-sharp fa-solid fa-bell"></i>
      </a>
    </div>

    <div class="user-info">
      <h4>{{ auth.user()?.name }}</h4>
      <h5>Admin</h5>
    </div>

    <app-dropdown-avatar
      [options]="options"
      [avatarUrl]="auth.user()?.picture"
    />
  </div>
</aside>
