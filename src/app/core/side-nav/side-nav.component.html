<aside>
  <span class="spacer"></span>

  <div class="active-user-container">
    <div class="notification-icon">
      <a
        routerLink="/notifications"
        routerLinkActive="active"
        aria-label="Notifications"
      >
        <i class="fa-sharp fa-solid fa-bell"></i>
      </a>
    </div>

    <div class="user-info">
      <h4>{{ displayName() }}</h4>
    </div>

    <p-button (click)="toggleDarkMode()" text>
      <i class="pi" [class.pi-moon]="isDarkMode" [class.pi-sun]="!isDarkMode"></i>
    </p-button>

    <app-avatar [photo]="auth.auth0User()?.picture" (click)="menu.toggle($event)" />
  </div>
</aside>
<p-menu #menu [model]="menuItems" [popup]="true" />

<span id="square"><span id="circle"></span></span>
