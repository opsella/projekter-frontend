<app-auth-page-wrapper>
  <div>
    <h1>Get Started</h1>
  </div>

  <div class="button-container">
    <button mat-button mat-raised-button color="primary" (click)="auth.login()">
      Login
    </button>
    <button
      mat-button
      mat-raised-button
      color="accent"
      routerLink="/registration/register"
    >
      Signup
    </button>
  </div>

  <ul class="extras">
    <li><a href="#">About Us</a></li>
    <li><a href="#">Blog</a></li>
    <li><a href="#">Request Demo</a></li>
  </ul>
</app-auth-page-wrapper>
