<p-dialog>
  <ng-template #header>
    <h2>Invite New User</h2>
  </ng-template>

  <form>
    <p-ifta-label>
      <label for="email"></label>
      <input pInputText type="email" id="email">
    </p-ifta-label>
  </form>

  <ng-template #footer>
    <p-button label="Cancel"></p-button>
    <p-button label="Invite"></p-button>
  </ng-template>
</p-dialog>
