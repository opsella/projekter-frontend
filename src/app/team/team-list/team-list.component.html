<p-breadcrumb [model]="breadcrumbItems" [home]="home" [style]="{ 'margin-bottom': '1rem' }"/>

<app-content-section title="My Team">
  <p-toolbar>
    <ng-template #start>
      <div style="display: flex; gap: 0.5rem;">
        <p-button icon="pi pi-plus" label="New" (click)="createTeam()"></p-button>
        <p-button label="Delete"
                  severity="danger"
                  outlined
                  (click)="deleteTeams()"
                  [disabled]="selectedTeams().length === 0">
        </p-button>
      </div>
    </ng-template>
  </p-toolbar>

  @if (teams.status() === "loading") {
    <span>loading...</span>
  } @else if (teams.status() === "error") {
    <span>There was an error loading your teams...</span>
  } @else if (teams.status() === "resolved") {
    <app-simple-table
      [data]="teams.value()"
      [config]="tableConfig"
      [(selectedItems)]="selectedTeams"
    />
  }

</app-content-section>
