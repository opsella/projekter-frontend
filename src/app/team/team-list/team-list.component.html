<p-breadcrumb [model]="breadcrumbItems" [home]="home" [style]="{ 'margin-bottom': '1rem' }"/>

<app-content-section title="My Team">
  <p-toolbar>
    <ng-template #start>
    </ng-template>

    <ng-template #end>
      <p-button label="Invite" (click)="createTeam()"></p-button>
    </ng-template>
  </p-toolbar>

  @if (teams.status() === "loading") {
    <span>loading...</span>
  } @else if (teams.status() === "error") {
    <span>There was an error loading your teams...</span>
  } @else if (teams.status() === "resolved") {
    <app-simple-table
      [data]="teams.value()"
      [config]="tableConfig"
    />
  }

</app-content-section>
