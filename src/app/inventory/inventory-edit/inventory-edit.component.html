<app-page-wrapper [title]="title">
  <div *ngIf="vm$ | async as vm">
    <app-equipment-edit-form
      *ngIf="vm.isEquipment$ && vm.hasData$"
      [details]="vm.inventoryItem$"
    ></app-equipment-edit-form>

    <app-material-edit-form
      *ngIf="vm.isMaterial$ && vm.hasData$"
      [details]="vm.inventoryItem$"
    ></app-material-edit-form>

    <app-inventory-add *ngIf="!editInventory"></app-inventory-add>
  </div>
</app-page-wrapper>
