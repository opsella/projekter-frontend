<section>
  <mat-stepper [linear]="true" #stepper>
    <mat-step [stepControl]="itemInformationGroup">
      <form [formGroup]="itemInformationGroup">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput placeholder="Name" formControlName="name" required>
          <mat-error *ngIf="itemInformationGroup.controls.name.hasError('required')">This field is required</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Code</mat-label>
          <input matInput placeholder="Code" formControlName="code" required>
          <mat-error *ngIf="itemInformationGroup.controls.code.hasError('required')">This field is required</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Description</mat-label>
          <input matInput placeholder="Description" formControlName="description" required>
          <mat-error *ngIf="itemInformationGroup.controls.description.hasError('required')">This field is required</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Qty</mat-label>
          <input matInput placeholder="Qty" formControlName="qty" required>
        </mat-form-field>

          <button mat-button matStepperNext>Next</button>
      </form>
    </mat-step>

    <mat-step [stepControl]="categoryInformationGroup">
      <form [formGroup]="categoryInformationGroup">
        <h2>Apply to existing category?</h2>
        <mat-form-field>
          <mat-label>Categories</mat-label>
          <mat-select formControlName="options" placeholder="Select a category...">
            <mat-option>Select a category...</mat-option>
            <mat-option *ngFor="let category of categories" [value]="category">
              {{ category }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        OR

        <h2>Apply to a new category?</h2>
        <mat-form-field>
          <input matInput formControlName="name" placeholder="Name">
          <mat-error *ngIf="categoryInformationGroup.controls.name.hasError('required')">This field is required</mat-error>
        </mat-form-field>
        <mat-form-field>
          <input matInput formControlName="description" placeholder="Description">
          <mat-error *ngIf="categoryInformationGroup.controls.description.hasError('required')">This field is required</mat-error>
        </mat-form-field>

        <div>
          <button mat-button matStepperPrevious>Back</button>
          <button mat-button matStepperNext>Next</button>
        </div>
      </form>
    </mat-step>

    <mat-step>
      <p>You are now done.</p>
      <div>
        <button mat-button matStepperPrevious>Back</button>
        <button mat-button (click)="stepper.reset()">Reset</button>
      </div>
    </mat-step>
  </mat-stepper>
</section>
