<app-page-wrapper title="Details">
  <div *ngIf="vm$ | async as vm">
    <!--    Still debating on whether or not to have separate components to render-->
    <!--    data. Or leave it all in this component with conditional rendering of specific-->
    <!--    elements.-->
    <app-equipment-details
      *ngIf="isEquipment(vm.inventoryDetails)"
      [details]="vm.inventoryDetails"
    ></app-equipment-details>

    <app-material-details
      *ngIf="isMaterial(vm.inventoryDetails)"
      [details]="vm.inventoryDetails"
    ></app-material-details>
  </div>
</app-page-wrapper>
