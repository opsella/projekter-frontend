<p-dialog [visible]="visible()">
  <ng-template #header>
    <h2>Add Specification to Project</h2>
  </ng-template>
  <form [formGroup]="form">
    <p-ifta-label>
      <label for="code">Code</label>
      <input pInputText type="text" id="code" formControlName="code" />
    </p-ifta-label>

    <p-ifta-label>
      <label for="title">Code</label>
      <input pInputText type="text" id="title" formControlName="title" />
    </p-ifta-label>

    <p-ifta-label>
      <label for="description">Code</label>
      <input pInputText type="text" id="description" formControlName="description" />
    </p-ifta-label>
  </form>
  <ng-template #footer>
    <p-button label="Cancel" [text]="true" severity="secondary" (click)="onCancelClick()" />
    <p-button label="Submit" [outlined]="true" severity="secondary" (click)="onSubmitClick()" />
  </ng-template>
</p-dialog>
