<h2 mat-dialog-title>Add Specification to Project</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Code</mat-label>
      <input matInput type="text" formControlName="code" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Title</mat-label>
      <input matInput type="text" formControlName="title" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Description</mat-label>
      <input matInput type="text" formControlName="description" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton (click)="onCancelClick()">Cancel</button>
  <button mat-flat-button (click)="onSubmitClick()">Submit</button>
</mat-dialog-actions>
