<form [formGroup]="form">
  <div class="form-row">
    <p-inputgroup>
      <p-float-label variant="in">
        <input pInputText type="text" id="code" formControlName="code" />
        <label for="code">Code</label>
      </p-float-label>
    </p-inputgroup>
  </div>

  <div class="form-row">
    <p-inputgroup>
      <p-float-label variant="in">
        <input pInputText type="text" id="title" formControlName="title" />
        <label for="title">Title</label>
      </p-float-label>
    </p-inputgroup>
  </div>

  <div class="form-row">
    <p-inputgroup>
      <p-float-label variant="in">
        <input pInputText type="text" id="description" formControlName="description" />
        <label for="description">Description</label>
      </p-float-label>
    </p-inputgroup>
  </div>
</form>

<div>
  <p-button label="Cancel" [text]="true" severity="secondary" (click)="onCancelClick()" />
  <p-button label="Submit" [outlined]="true" severity="primary" [disabled]="form.invalid" (click)="onSubmitClick()" />
</div>
