<div
  class="project-card"
  [matBadge]="alerts"
  [matBadgeHidden]="alerts <= 0"
  matBadgeSize="large"
>
  <div class="header">
    <span class="title">{{ title }}</span>
    <div class="location">
      <mat-icon>location_on</mat-icon>
      <span>{{ location }}</span>
    </div>
  </div>

  <div class="content-container">
    <img
      [src]="photo"
      alt="photo used for identifying the project: {{ title }}"
    />
    <div class="content">
      <app-simple-chip>{{ status }}</app-simple-chip>
    </div>
  </div>
</div>
