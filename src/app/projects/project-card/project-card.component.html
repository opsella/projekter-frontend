<p-overlay-badge [badgeDisabled]="alerts <= 0" [value]="alerts" badgeSize="large">
  <p-card [style]="{ 'width': '300px ' }">
    <ng-template #header>
      <img
        [src]="photo"
        style="width: 100%; height: 200px;"
        alt="photo used for identifying the project: {{ projectName }}"
      />
    </ng-template>
    <ng-template #title>{{ projectName }}</ng-template>
    <ng-template #subtitle>
      <i class="pi pi-map-marker"></i>
      <span>{{ location }}</span>
    </ng-template>

    <div class="status">
      <p-chip [label]="status" />
    </div>

    <ng-template #footer>
      <p-button label="Details" (click)="viewDetails(projectId())"></p-button>
    </ng-template>
  </p-card>
</p-overlay-badge>
