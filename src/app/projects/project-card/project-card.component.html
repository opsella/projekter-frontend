<mat-card class="project-card"
          appearance="outlined"
          [matBadge]="alerts"
          [matBadgeHidden]="alerts <= 0"
          matBadgeSize="large">
  <img mat-card-image
       [src]="photo"
       alt="Photo of a Shiba Inu">
  <mat-card-header>
    <mat-card-title>{{ title }}</mat-card-title>
    <mat-card-subtitle class="location">
      <mat-icon>location_on</mat-icon>
      <span>location</span>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-chip>{{ status }}</mat-chip>
  </mat-card-content>
</mat-card>
