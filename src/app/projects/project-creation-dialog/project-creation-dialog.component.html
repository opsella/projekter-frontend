<form [formGroup]="form">
  <p-input-group>
    <p-float-label variant="in">
      <input pInputText type="text" id="project-name" formControlName="name" />
      <label for="project-name">Project Name</label>
    </p-float-label>
  </p-input-group>

  <p-input-group>
    <p-select [options]="statuses()"
              appendTo="body"
              formControlName="status"
              optionLabel="name"
              placeholder="Project Status">
    </p-select>
  </p-input-group>

  <p-input-group>
    <p-inputgroup-addon>
      www
    </p-inputgroup-addon>
    <p-float-label variant="in">
      <input pInputText type="text" id="photo-url" formControlName="photo" />
      <label for="photo-url">Photo Url</label>
    </p-float-label>
  </p-input-group>
</form>

<div>
  <p-button label="Cancel" [text]="true" severity="secondary" (click)="onCancelClick()"/>
  <p-button label="Submit" [outlined]="true" severity="primary" (click)="onSubmitClick()"/>
</div>
