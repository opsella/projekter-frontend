<h2 mat-dialog-title>Create New Project</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Project Name</mat-label>
      <input matInput type="text" formControlName="name" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Select option</mat-label>
      <mat-select formControlName="status">
        @for (status of data; track status.id) {
          <mat-option [value]="status.id">
            {{ status.name }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Photo Url</mat-label>
      <input matInput type="text" formControlName="photo" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton (click)="onCancelClick()">Cancel</button>
  <button mat-flat-button (click)="onSubmitClick()">Submit</button>
</mat-dialog-actions>
