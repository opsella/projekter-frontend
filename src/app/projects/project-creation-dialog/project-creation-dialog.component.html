<p-dialog>
  <ng-template #header>
    <h2>Create New Project</h2>
  </ng-template>
  <form [formGroup]="form">
    <p-ifta-label>
      <label for="project-name">Project Name</label>
      <input pInputText type="text" id="project-name" formControlName="name" />
    </p-ifta-label>

    <p-select [options]="statuses"
              formControlName="status"
              optionLabel="status"
              placeholder="Project Status">
    </p-select>

    <p-ifta-label>
      <label for="photo-url">Photo Url</label>
      <input pInputText type="text" id="photo-url" formControlName="photo" />
    </p-ifta-label>
  </form>
  <ng-template #footer>
    <p-button label="Cancel" [text]="true" severity="secondary" (click)="onCancelClick()"/>
    <p-button label="Submit" [outlined]="true" severity="secondary" (click)="onSubmitClick()"/>
  </ng-template>
</p-dialog>
