<app-page-wrapper title="Projects">
  <section style="border: solid 1px red; height: 80px">
    This area could be for "Cards" displaying analytics (# of active projects,
    clocked in employees, etc).
  </section>
  <div *ngIf="vm$ | async as vm">
    <app-expansion-table
      *ngIf="vm.hasData$"
      [data]="vm.projects$"
      [filters]="vm.tableFilters$"
    ></app-expansion-table>
  </div>
</app-page-wrapper>
