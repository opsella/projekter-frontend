<app-setup-page-wrapper title="You do not have any projects." flow1ButtonText="Create Project" flow2ButtonText="Import Projects">
  <div flow1>
    <h1>How will you track this item?</h1>

    <form [formGroup]="templateOptions">
      <ng-template matStepLabel>Select Template</ng-template>
      <mat-label>Templates</mat-label>
      <mat-select formControlName="options" placeholder="Select a template...">
        <mat-option>Select a template...</mat-option>
        <mat-option *ngFor="let template of templates" [value]="template">
          {{ template }}
        </mat-option>
      </mat-select>
    </form>

    OR

    <div>
      SOME FORM HERE TO CREATE PROJECT
    </div>
  </div>

  <div flow2>
    Need to figure out if we can import projects or not
  </div>

  <a mat-button [routerLink]="projectRoute" action>CREATE</a>
</app-setup-page-wrapper>
