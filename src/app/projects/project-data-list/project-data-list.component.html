<section>
  <div class="project-filter">
    <p-select [options]="states"
              (onChange)="onFilterChanged($event)"
              placeholder="Project State">
    </p-select>
  </div>

  <div class="project-grid">
    @switch (projects.status()) {
      @case ("loading") {
        <div>loading...</div>
      }
      @case ("resolved") {
        @for (project of projects.value(); track project.id) {
          <app-project-card
            [title]="project.name"
            [status]="project.state"
            [photo]="project.photo"
            [id]="project.id"
          >
          </app-project-card>
        }
      }
      @case ("error") {
        <span>We had trouble loading your Projects. Please try again.</span>
      }
    }
  </div>
</section>

<section class="actions">
  <p-button label="New Project" (click)="createProject()"></p-button>
</section>
