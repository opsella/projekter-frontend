<section class="actions">
  <button mat-flat-button
          (click)="createProject()">
    New Project
  </button>
</section>

<section>
  <div class="project-grid">
    @for (project of projects; track project.id) {
      <app-project-card
        [title]="project.title"
        [status]="project.status"
        [photo]="project.photo"
      >
      </app-project-card>
    }
  </div>
</section>

@if (openModal) {
  <div class="modal-overlay">
    <div class="modal-form">
      {{ openModal }}

      <form [formGroup]="projectCreationForm" (ngSubmit)="onSubmit()">
        <label for="first-name">Project Name</label>
        <input id="first-name" type="text" formControlName="projectName" />

        <button type="submit" [disabled]="projectCreationForm.valid">
          Save
        </button>
      </form>
    </div>
  </div>
}
