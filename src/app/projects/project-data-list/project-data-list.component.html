<section>
  <div class="project-filter">
    <mat-form-field>
      <mat-label>Project State</mat-label>
      <mat-select (selectionChange)="onFilterChanged($event)">
        <mat-option value="Draft">Draft</mat-option>
        <mat-option value="Published">Published</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="project-grid">
    @switch (projects.status()) {
      @case ("loading") {
        <div>loading...</div>
      }
      @case ("resolved") {
        @for (project of projects.value(); track project.id) {
          <app-project-card
            [title]="project.name"
            [status]="project.state"
            [photo]="project.photo"
            (click)="viewDetails(project.id)"
          >
          </app-project-card>
        }
      }
      @case ("error") {
        <span>We had trouble loading your Projects. Please try again.</span>
      }
    }
  </div>
</section>

<section class="actions">
  <button mat-flat-button (click)="createProject()">New Project</button>
</section>
