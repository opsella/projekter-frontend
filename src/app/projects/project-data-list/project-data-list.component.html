<section class="actions">
  <button (click)="createProject()">New Project</button>
</section>
<section class="project-section">
  <app-card
    *ngFor="let project of projects"
    [title]="project.title"
    [status]="project.status"
    [allocatedTime]="project.allocatedTime"
    [totalTime]="project.totalTime"
    (click)="viewDetails(project.id)"
  ></app-card>
</section>

<div *ngIf="openModal" class="modal-overlay">
  <div class="modal-form">
    {{ openModal }}

    <form [formGroup]="projectCreationForm" (ngSubmit)="onSubmit()">
      <label for="first-name">Project Name</label>
      <input id="first-name" type="text" formControlName="projectName" />

      <button type="submit" [disabled]="projectCreationForm.invalid">Save</button>
    </form>
  </div>
</div>
