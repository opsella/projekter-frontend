<p-breadcrumb [model]="breadcrumbItems" [home]="home" [style]="{ 'margin-bottom': '1rem' }"/>

<app-content-section [title]="'Project: ' + (project.value()?.name ?? '')">
  <div style="display: flex; flex-flow: row;">
    <div style="padding-right: 1rem;">
      <img
        priority
        [ngSrc]="
      project.value()?.photo ||
      'https://via.placeholder.com/200x200.jpg?text=No+Image'
    "
        width="200"
        height="200"
        alt="Project Image"
      />
    </div>
    <div style="display: flex; flex-flow: column; justify-content: start; gap: 1rem;">
      <div>
        <span>
          <i class="pi pi-map-marker"></i>
          {{ project.value()?.location.address?.address_lines[0] ?? "no address" }}
        </span>
      </div>

      <div style="display: flex; flex-flow: row; align-content: start; gap: 1rem;">
        <p-chip [label]="project.value()?.state" />
        <p-chip [label]="project.value()?.status_id | projectStatus" />
      </div>
    </div>
  </div>
</app-content-section>

<app-content-section title="Tasks" expandable>
  <p-toolbar>
    <ng-template #start>
      <div style="display: flex; gap: 1rem;">
      <p-button label="New" severity="primary" (click)="addTask()">
        <i class="pi pi-plus"></i>
      </p-button>
      <p-button label="Delete" outlined [disabled]="selectedTasks().length <= 0" severity="danger" (click)="deleteTasks()">
        <i class="pi pi-trash"></i>
      </p-button>
      </div>
    </ng-template>

    <ng-template #end>
      <div style="display: flex; gap: 1rem;">
        <p-button label="Import" text severity="secondary">
          <i class="pi pi-plus"></i>
        </p-button>
        <p-button label="Export" text severity="secondary">
          <i class="pi pi-upload"></i>
        </p-button>
      </div>
    </ng-template>
  </p-toolbar>

  <app-simple-table
    [data]="project.value()?.tasks ?? []"
    [config]="{ columns: projectTaskColumns, actions: projectTaskActions, alertConfig: projectTaskAlertConfig }"
    [(selectedItems)]="selectedTasks"
  />
</app-content-section>

<app-content-section title="Specifications" expandable>
  <p-toolbar>
    <ng-template #start>
      <div style="display: flex; gap: 1rem;">
        <p-button label="New" severity="primary" (click)="addSpecification()">
          <i class="pi pi-plus"></i>
        </p-button>
        <p-button label="Delete" outlined [disabled]="selectedSpecs().length <= 0" severity="danger" (click)="deleteSpec()">
          <i class="pi pi-trash"></i>
        </p-button>
      </div>
    </ng-template>

    <ng-template #end>
      <div style="display: flex; gap: 1rem;">
        <p-button label="Import" text severity="secondary">
          <i class="pi pi-plus"></i>
        </p-button>
        <p-button label="Export" text severity="secondary">
          <i class="pi pi-upload"></i>
        </p-button>
      </div>
    </ng-template>
  </p-toolbar>

  <app-simple-table
    [data]="project.value()?.specifications ?? []"
    [config]="specificationTableConfig"
    [(selectedItems)]="selectedSpecs"
  />
</app-content-section>

<app-content-section title="Discussion" expandable>
  <div>
    <p-timeline [value]="discussion?.value()?.messages ?? []" >
      <ng-template #marker let-event>
        <span style="display: flex; width: 2rem; height: 2rem; justify-items: center; align-items: center; justify-content: center; align-content: center; z-index: 10; border-radius: 50%"
          [style]="{ 'background-color': 'orange' }"
        >
          <i class="pi pi-user"></i>
        </span>
      </ng-template>
      <ng-template #content let-event>
        <app-discussion-message-block [message]="event" />
      </ng-template>
    </p-timeline>
  </div>

  <form [formGroup]="discussionForm"
        (ngSubmit)="onDiscussionMessageSubmit()"
        style="display: flex; flex-flow: column; gap: 4px;">
    <p-editor formControlName="content" [style]="{ height: '160px' }">

    </p-editor>
    <p-button label="Submit" severity="secondary" type="submit" [style]="{ width: '100%' }" />
  </form>
</app-content-section>
