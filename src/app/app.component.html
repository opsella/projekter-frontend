@if ((auth.isAuthenticated$ | async) === true) {
  <div class="main-application">
    <app-top-nav></app-top-nav>

    <div class="main-wrapper">
      <app-side-nav></app-side-nav>
      <span id="square"><span id="circle"></span></span>

      <app-main-content class="content"></app-main-content>
    </div>
  </div>
} @else {
  <div class="main-application">
    <div class="main-wrapper">
      <app-main-content class="content"></app-main-content>
    </div>
  </div>
}

<p-toast />
