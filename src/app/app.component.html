<app-login
  *ngIf="(auth.isAuthenticated$ | async) === false; else loggedIn"
></app-login>

<ng-template #loggedIn>
  <div class="main-application">
    <app-top-nav class="header"></app-top-nav>

    <div class="main-wrapper">
      <app-side-nav class="sidenav"></app-side-nav>

      <app-main-content class="main"></app-main-content>
    </div>
  </div>
</ng-template>
